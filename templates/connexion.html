<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion — Majt Shop</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/connexion.css') }}">
</head>
<body class="connexion-page">
    <a href="{{ url_for('accueil') }}" class="connexion-retour">← Retour à l'accueil</a>

    <div class="connexion-carte">
        <div class="connexion-panneau-marque">
            <div class="connexion-points"></div>
            <div class="connexion-marque-contenu">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Majt Shop" class="connexion-logo">
                <h2>Majt Shop</h2>
                <p>Livraison rapide et sécurisée</p>
            </div>
        </div>

        <div class="connexion-panneau-form">
            <h1>Bienvenue sur votre espace</h1>
            <p class="connexion-sous-titre">Connectez-vous en tant qu'administrateur ou livreur.</p>

            {% if erreur %}<p class="admin-erreur">{{ erreur }}</p>{% endif %}

            <form method="post">
                <label for="identifiant">Identifiant</label>
                <input type="text" id="identifiant" name="identifiant" placeholder="Utilisateur admin ou numéro livreur (LV...)" required autofocus>

                <label for="mot_de_passe">Mot de passe</label>
                <div class="champ-mot-de-passe">
                    <input type="password" id="mot_de_passe" name="mot_de_passe" required>
                    <button type="button" class="bouton-oeil" aria-label="Afficher le mot de passe">
                        <svg class="icone-oeil-ouvert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="icone-oeil-ferme" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>

                <button type="submit" class="connexion-bouton">Se connecter</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/mot-de-passe.js') }}"></script>
</body>
</html>
